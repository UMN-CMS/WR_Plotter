# data/plot_settings/default.yaml
# Plot settings shared by every era: rebin, xlim, ylim (and ratio_ylim) per region and variable.
# A region's `_all` entry holds defaults for all of its variables (e.g. the ratio range); a
# variable's own keys win.  Stack plots use only the bottom of `ylim` (never above 0.1 when data
# are drawn): their top follows the content (plotting_helpers.stack_ylim).
# An era file starts with `inherit: default` and lists only what differs; an era without a file
# uses the one named by `plot_settings` in data/lumi.yaml, else this file (see config.load_plot_settings).

# 1) Resolved-topology variables: merged into every resolved block below, and the fallback for
#    resolved regions only (config.get_var_cfg).  The analyzer fills no AK4-jet, dijet or 3-/4-object
#    histograms in the boosted regions, so the boosted blocks list every variable they plot.
common_variables: &common_vars
  eta_leading_jet:             { rebin: 3,  xlim: [-2.4, 2.4],  ylim: [1e0,  1e8] }
  eta_leading_lepton:          { rebin: 3,  xlim: [-2.4, 2.4],  ylim: [1e0,  1e8] }
  eta_subleading_jet:          { rebin: 3,  xlim: [-2.4, 2.4],  ylim: [1e0,  1e8] }
  eta_subleading_lepton:       { rebin: 3,  xlim: [-2.4, 2.4],  ylim: [1e0,  1e8] }
  mass_dijet:                  { rebin: 10, xlim: [0, 3000],    ylim: [1e0,  1e8] }
  mass_dilepton:               { rebin: 2,  xlim: [60, 150],    ylim: [1e0,  1e8] }
  mass_fourobject:             { rebin: 10, rebin_variable: [0, 800, 1000, 1200, 1400, 1600, 2000, 2400, 2800, 3200, 8000], xlim: [800, 8000],  ylim: [1e-4,  1e8] }
  mass_threeobject_leadlep:    { rebin: 10, xlim: [0, 4000],    ylim: [1e0,  1e8] }
  mass_threeobject_subleadlep: { rebin: 10, xlim: [0, 4000],    ylim: [1e0,  1e8] }
  phi_leading_jet:             { rebin: 2,  xlim: [-3.2, 3.2],  ylim: [1e0,  1e8] }
  phi_leading_lepton:          { rebin: 2,  xlim: [-3.2, 3.2],  ylim: [1e0,  1e8] }
  phi_subleading_jet:          { rebin: 2,  xlim: [-3.2, 3.2],  ylim: [1e0,  1e8] }
  phi_subleading_lepton:       { rebin: 2,  xlim: [-3.2, 3.2],  ylim: [1e0,  1e8] }
  pt_dijet:                    { rebin: 5,  xlim: [0, 1000],    ylim: [1e0,  1e8] }
  pt_dilepton:                 { rebin: 2,  xlim: [0, 800],    ylim: [1e0,  1e8] }
  pt_fourobject:               { rebin: 2,  xlim: [0, 800],    ylim: [1e0,  1e8] }
  pt_leading_jet:              { rebin: 2,  xlim: [40, 1400],    ylim: [1e0,  1e8] }
  pt_leading_lepton:           { rebin: 2,  xlim: [60, 800],   ylim: [1e0,  1e8] }
  pt_subleading_jet:           { rebin: 2,  xlim: [40, 1000],   ylim: [1e0,  1e8] }
  pt_subleading_lepton:        { rebin: 1,  xlim: [50, 300],    ylim: [1e0,  1e8] }
  pt_threeobject_leadlep:      { rebin: 2,  xlim: [0, 800],    ylim: [1e0,  1e8] }
  pt_threeobject_subleadlep:   { rebin: 2,  xlim: [0, 1000],    ylim: [1e0,  1e8] }

