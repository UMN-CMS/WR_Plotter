# data/plot_settings/RunIII2024Summer24.yaml
# RunIII2024Summer24 (also used by the 2024 and Run3 combinations, data/lumi.yaml).
# Only the (region, variable, key) values that differ from default.yaml are listed.

inherit: default

wr_mumu_resolved_dy_cr:
  pt_dilepton:                   { ylim: [1e0, 1e6] }
  pt_leading_jet:                { ylim: [1e0, 1e6] }

wr_ee_resolved_dy_cr:
  pt_dilepton:                   { ylim: [1e0, 1e6] }
  pt_leading_jet:                { ylim: [1e0, 1e6] }

wr_resolved_flavor_cr:
  mass_dilepton:                 { ylim: [1e-1, 1e5] }
  mass_fourobject:               { ratio_ylim: [0, 2] }
  pt_leading_jet:                { ylim: [1e-1, 1e6] }

wr_mumu_boosted_dy_cr:
  mass_twoobject:                { ylim: [1e0, 1e5] }
  pt_dilepton:                   { ylim: [1e0, 1e6] }
  pt_leading_AK8Jets:            { ylim: [1e0, 1e6] }

wr_ee_boosted_dy_cr:
  mass_twoobject:                { ylim: [1e0, 1e5] }
  pt_dilepton:                   { ylim: [1e0, 1e6] }
  pt_leading_AK8Jets:            { ylim: [1e0, 1e6] }

wr_emu_boosted_flavor_cr:
  mass_dilepton:                 { ylim: [1e-1, 1e5] }
  mass_twoobject:                { ylim: [1e-2, 1e5], ratio_ylim: [0, 2] }
  pt_leading_AK8Jets:            { ylim: [1e-1, 1e5] }

wr_mue_boosted_flavor_cr:
  mass_dilepton:                 { ylim: [1e-1, 1e5] }
  mass_twoobject:                { ylim: [1e-2, 1e5], ratio_ylim: [0, 2] }
  phi_leading_AK8Jets:           { ylim: [1e-1, 1e6] }
  pt_leading_AK8Jets:            { ylim: [1e-1, 1e5] }

wr_mumu_boosted_sr:
  mass_twoobject:                { ylim: [1e-1, 1e6] }

wr_ee_boosted_sr:
  mass_twoobject:                { ylim: [1e-1, 1e6] }
