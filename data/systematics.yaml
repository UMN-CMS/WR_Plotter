# Systematic uncertainty names used for up/down envelope plots.
# Each entry corresponds to a pair of histogram keys:
#   syst_{name}up_{region}/...  and  syst_{name}down_{region}/...
#
# Weight-based systematics:
systematics:
  - lumi
  - pileup
  - muonrecosf
  - muonidsf
  - muonisosf
  - muontrigsf
  - loosemuonrecosf
  - loosemuonidsf
  - electronrecosf
  - electronidsf
  - electrontrigsf
  - looseelectronrecosf
  # Shape systematics (re-run selections with shifted kinematics):
  - jer
  - jes
  - elescale
  - elesmear
  - muscale
  - musmear
  # Theory (weight-based, normalized per dataset so only acceptance/shape move):
  # "scale" is a composite: envelope of scalemur / scalemuf / scalemurf
  - scale
  - psisr
  - psfsr
