# data/dy_samples.yaml
# Drell-Yan samples, each read from its own file in the analysis set's --dir (WrCoffea
# wrcoffea/cli_utils.py dy_file_tag):
#   - the default sample (`default` below: the analyzer's default --dy variant, not reweighted)
#     is WRAnalyzer_DYJets.root,
#   - any other is WRAnalyzer_DYJets_<tag>.root, made by run_analysis.py <era> DYJets
#     <analyzer_args, default --dy <tag>> --dir <dir>; <tag> is the --dy variant plus _zpt or
#     _zpt_reshape for --dy-reweight zpt or zpt+reshape.
# `--dy TAG=DIR` reads the tag's file from another directory (or that directory's
# WRAnalyzer_DYJets.root, the old layout).
#
# Old layout (sets made before 2026-10-12): every variant was WRAnalyzer_DYJets.root in its own
# directory, <dir>_<name>_dy for the tag and each of its `aliases`, plus any `legacy_dirs`
# ({dir} = --dir).  A tag whose file is not in --dir is read from there.
#
# `datasets` is a regex searched in the dataset names recorded in the file's manifest
# (WRAnalyzer_DYJets[_<tag>]_systematics.json).  A file holding a different sample than the
# tag claims is refused.  Patterns follow the Run 3 dataset names.
#
# `label` names the sample on the stack plots ("DY: <label>"); `short`, where given, replaces it in
# the DY-comparison legends, which list up to six samples at 20 pt.
#
# `analyzer_args` with --dy-reweight: the reweighting the tag stands for.  The plotter reads
# the one a file was made with from its event-weight histograms
# (event_weights/<region>/components/dy_zpt, dy_reshape) and refuses a mismatch.
#
# Since 2026-10-12 the analyzer does not reweight the default DY (LO HT-binned at its NNLO-
# normalized cross section; --dy-reweight none).  Sets made before then hold the Z-pT reweighted
# and reshaped DY in --dir itself: read it with --dy lo_ht_zpt_reshape=<dir>.

default: lo_ht

samples:
  lo_ht:
    label: "LO HT-binned"
    color: "#3f90da"
    datasets: "DYto2L-4Jets_Bin-HT-"
  lo_ht_zpt:
    # lo_ht with the DY Z-pT reweight, without the jet-pT reshape
    label: "LO HT-binned, Z $p_{T}$ reweight"
    short: "LO HT, Z $p_{T}$ rew."
    color: "#b9ac70"
    datasets: "DYto2L-4Jets_Bin-HT-"
    analyzer_args: "--dy-reweight zpt"
    aliases: [lo_ht_zptonly]
    legacy_dirs: ["{dir}_noreshape"]
  lo_ht_zpt_reshape:
    # lo_ht with the DY Z-pT reweight and the jet-pT reshape (the default before 2026-10-12)
    label: "LO HT-binned, Z + jet $p_{T}$ reweight"
    short: "LO HT, Z + jet $p_{T}$ rew."
    color: "#e76300"
    datasets: "DYto2L-4Jets_Bin-HT-"
    analyzer_args: "--dy-reweight zpt+reshape"
    aliases: [lo_ht_reweighted]
  lo_inc:
    label: "LO inclusive"
    color: "#bd1f01"
    datasets: "DYto2(E|Mu)-4Jets_Bin-MLL-"
  nlo_inc:
    label: "NLO inclusive"
    color: "#ffa90e"
    datasets: "DYto2(E|Mu)-2Jets_Bin-MLL-"
  nlo_mll:
    label: "NLO $m_{\\ell\\ell}$-binned"
    color: "#832db6"
    datasets: "DYto2(E|Mu)_Bin-MLL-"
  nlo_njet:
    label: "NLO jet-binned"
    color: "#94a4a2"
    datasets: "DYto2(E|Mu)-2Jets_Bin-[0-9]J-"
  nlo_ptll:
    # not a DY prediction: the analyzer adds the pT(ll) slices unstitched (Run 3: open-ended,
    # pT(ll) > 200 GeV counted 2-4 times, nothing below 100 GeV); see run_analysis.py
    label: "NLO $p_{T}^{\\ell\\ell}$-binned"
    color: "#a96b59"
    datasets: "DYto2L-2Jets_Bin-MLL-50-PTLL-"
