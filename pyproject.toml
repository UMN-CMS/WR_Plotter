[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wrplotter"
version = "0.1.0"
description = "WR analysis plotting package"
requires-python = ">=3.11"
dependencies = [
    "coffea==2025.12.0",
    "hist==2.9.2",
    "matplotlib==3.10.8",
    "mplhep==0.4.1",
    "numpy==2.3.5",
    "pyyaml==6.0.3",
    "uproot==5.7.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["wrplotter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
